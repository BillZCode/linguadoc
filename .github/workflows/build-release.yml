name: Build & Release Multi-Platform (APK & EXE)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. BUILD ANDROID APK
  # --------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend SPA
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename & Prepare APK
        run: |
          mkdir -p release-artifacts
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/LinguaDoc-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaDoc-Android-APK
          path: release-artifacts/LinguaDoc-v1.0.0.apk

  # --------------------------------------------------------------------------
  # 2. BUILD WINDOWS EXE (Installer & Portable)
  # --------------------------------------------------------------------------
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend & Build Assets
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Electron Dependencies
        run: |
          cd electron
          npm ci

      - name: Build Windows Executable via Electron Builder
        run: |
          cd electron
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinguaDoc-Windows-EXE
          path: dist-desktop/*.exe

  # --------------------------------------------------------------------------
  # 3. BUILD LINUX DESKTOP (AppImage & DEB)
  # --------------------------------------------------------------------------
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend & Build Assets
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Electron Dependencies
        run: |
          cd electron
          npm ci

      - name: Build Linux Binaries via Electron Builder
        run: |
          cd electron
          npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinguaDoc-Linux-Binaries
          path: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb

  # --------------------------------------------------------------------------
  # 4. PUBLISH GITHUB RELEASE (If Tagged)
  # --------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [ build-android, build-windows, build-linux ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: LinguaDoc-Android-APK
          path: release-files/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: LinguaDoc-Windows-EXE
          path: release-files/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: LinguaDoc-Linux-Binaries
          path: release-files/

      - name: Create GitHub Release with Binary Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          name: "LinguaDoc Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false

name: Build & Release Multi-Platform (APK & Desktop)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. BUILD ANDROID APK
  # --------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend SPA
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename & Prepare APK
        run: |
          mkdir -p release-artifacts
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/LinguaDoc-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaDoc-Android-APK
          path: release-artifacts/LinguaDoc-v1.0.0.apk

      - name: Attach APK to Existing GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/LinguaDoc-v1.0.0.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # 2. BUILD LINUX DESKTOP (AppImage & DEB)
  # --------------------------------------------------------------------------
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend & Build Assets
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Electron Dependencies
        run: |
          cd electron
          npm install

      - name: Build Linux Binaries via Electron Builder
        run: |
          cd electron
          npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinguaDoc-Linux-Binaries
          path: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb

      - name: Attach Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
